# One-off: applies the Fluorescence redesign from .github/redesign/payload.b64, then deletes
# the payload and this workflow. Verifies every input by SHA-256 before changing anything.
name: Apply redesign (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/redesign/payload.b64']
permissions:
  contents: write
concurrency: apply-redesign
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply the patch
        run: |
          set -euo pipefail
          base64 -d .github/redesign/payload.b64 | xz -d > /tmp/redesign.patch
          echo "693c3122b105c9a1ae4fce41b851d61b4b4ed86172f06c925975fdb896bc7cc4  /tmp/redesign.patch" | sha256sum -c -
          git apply --whitespace=nowarn /tmp/redesign.patch
      - name: Add IBM Plex Mono (OFL) from npm, verified
        run: |
          set -euo pipefail
          cd /tmp && npm pack @fontsource/ibm-plex-mono@5.3.0 --silent && tar xzf fontsource-ibm-plex-mono-5.3.0.tgz
          cp package/files/ibm-plex-mono-latin-400-normal.woff2 package/files/ibm-plex-mono-latin-500-normal.woff2 "$GITHUB_WORKSPACE/assets/fonts/"
          cd "$GITHUB_WORKSPACE"
          printf '%s\n' \
            "08949f728dc52d528e69b1667d15c89a5686a4ee9a296ff90983985f99c380f7  assets/fonts/ibm-plex-mono-latin-400-normal.woff2" \
            "01d285447409c8a588692162439a038b8cbd7871309ee20267b0d2d91c6e8e22  assets/fonts/ibm-plex-mono-latin-500-normal.woff2" | sha256sum -c -
      - name: Build pages
        run: node tools/build.mjs && node tools/build.mjs --check
      - name: Commit and push
        run: |
          set -euo pipefail
          git rm -q .github/redesign/payload.b64 .github/workflows/apply-redesign.yml
          git config user.name "Subhajit Dutta"
          git config user.email "subhajit-dutta-bio@users.noreply.github.com"
          git add -A
          git commit -q -m "Redesign: Fluorescence theme, static build, Software and CV pages, One-cell explorer" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01WLD3AzUir7cC5WUj4175ez"
          git push
