# Rebuilds the pages whenever the data, styles, scripts or build tool change on main, and commits
# the result. Edit a file in assets/data/ (even in the GitHub web editor) and the site updates itself.
name: Rebuild pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data/**'
      - 'assets/site.css'
      - 'assets/site.js'
      - 'tools/**'
permissions:
  contents: write
concurrency: rebuild-pages
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node tools/build.mjs && node tools/build.mjs --check
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "Pages already up to date."; exit 0; fi
          git config user.name "Subhajit Dutta"
          git config user.email "subhajit-dutta-bio@users.noreply.github.com"
          git add -A
          git commit -q -m "Rebuild pages from data"
          git push
