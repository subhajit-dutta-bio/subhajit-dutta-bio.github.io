# Fails a push or pull request if the pages are out of date with assets/data/.
# It only checks; it never changes or deploys anything.
name: Check site build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs --check
